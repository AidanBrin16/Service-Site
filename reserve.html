<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Reserve a Table</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">Aidan's Restaurant</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link" href="reserve.html">Reserve a Table</a>
        </li>
        <li class="nav-item">
          <a class="nav-link active" href="order.html">Order</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<!-- Reservation Section -->
<div class="reservation-wrapper">
  <div class="reservation-card">

    <!-- Left column -->
    <div class="res-col">
      <div class="res-col-header">Date and Time</div>
      <div class="res-col-body">

        <!-- Calendar -->
        <div class="res-box">
          <input type="date" id="res-date" class="res-date-input" />
        </div>

        <!-- Time dropdown -->
        <div class="res-box res-box--short">
          <select id="res-time" class="res-select">
            <option value="" disabled selected>Select a time</option>
            <option>11:00 AM</option>
            <option>11:30 AM</option>
            <option>12:00 PM</option>
            <option>12:30 PM</option>
            <option>1:00 PM</option>
            <option>5:00 PM</option>
            <option>5:30 PM</option>
            <option>6:00 PM</option>
            <option>6:30 PM</option>
            <option>7:00 PM</option>
            <option>7:30 PM</option>
            <option>8:00 PM</option>
          </select>
        </div>

        <!-- Patio checkbox -->
        <div class="res-checkbox-row">
          <input type="checkbox" id="patio" />
          <label for="patio">Patio seating?</label>
        </div>

      </div>
    </div>

    <!-- Divider -->
    <div class="res-divider"></div>

    <!-- Right column -->
    <div class="res-col">
      <div class="res-col-header">Available Times</div>
      <div class="res-col-body" id="time-slots">
        <button class="time-slot">11:00 AM — 2 seats left</button>
        <button class="time-slot">12:00 PM — Available</button>
        <button class="time-slot">6:00 PM — Available</button>
        <button class="time-slot">7:30 PM — Available</button>
      </div>
    </div>

  </div>

  <!-- Confirm button -->
  <div class="res-confirm-row">
    <button class="res-confirm-btn" onclick="window.location.href='confirmRes.html'">
  Confirm Reservation
</button>
  </div>
</div>

<footer class="site-footer">
  <p>Aidan's Restaurant — Designed & Created by Aidan Brin — 2026</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="JS/script.js"></script>
</body>
</html>
