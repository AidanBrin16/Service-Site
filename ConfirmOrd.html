<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Order Confirmed</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<nav class="navbar navbar-expand-lg navbar-dark bg-dark fixed-top">
  <div class="container">
    <a class="navbar-brand" href="index.html">Aidan's Restaurant</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="navbarNav">
      <ul class="navbar-nav ms-auto">
        <li class="nav-item">
          <a class="nav-link active" href="reserve.html">Reserve a Table</a>
        </li>
        <li class="nav-item">
          <a class="nav-link" href="order.html">Order</a>
        </li>
      </ul>
    </div>
  </div>
</nav>

<div class="confirm-wrapper">
  <div class="confirm-card">
    <div class="confirm-header">
      <h1 class="confirm-title">Order Confirmed</h1>
    </div>
    <div class="confirm-body">
      <input type="email" class="confirm-email-input" placeholder="Enter email to receive confirmation" />
      <p class="delivery-time" id="delivery-time"></p>
    </div>
  </div>
</div>

<footer class="site-footer">
  <p>Aidan's Restaurant — Designed & Created by Aidan Brin — 2026</p>
</footer>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script>
  const minutes = Math.floor(Math.random() * 41) + 5; // random 5–45
  document.getElementById('delivery-time').textContent = `Food will arrive in ${minutes} minutes.`;
</script>
</body>
</html>
